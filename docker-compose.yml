services:
  db:
    image: postgres:14-alpine
    container_name: srt_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=videodb
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d videodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: srt_api
    build: ./app  # app/Dockerfile을 사용하여 이미지 빌드
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./app:/app
      - ./recordings:/recordings # 녹화 폴더를 컨테이너와 공유
    ports:
      - "8000:8000" # FastAPI API 포트
      - "9000:9000/udp" # SRT 스트림 수신 포트
    environment:
      - DATABASE_URL=postgresql://user:password@db/videodb
    depends_on:
      db:
        condition: service_healthy